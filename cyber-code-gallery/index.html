<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cyber Code Gallery</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="scanline"></div>

<h1>Stampsynk - WebCode Gallery</h1>

<div class="filters">
    <button class="filter-btn active" data-category="all">Todos</button>
    <button class="filter-btn" data-category="banners">Banners</button>
    <button class="filter-btn" data-category="button">Buttons</button>
    <button class="filter-btn" data-category="footer">Footers</button>
    <button class="filter-btn" data-category="effect">Effects</button>
</div>

<div class="code-gallery">

    <!-- BANNERS -->
    <div class="code-column category-banners active">
        <div class="code-title">
            <h2>🔘 Neon Dreams Banner</h2>
        </div>

        <iframe class="codepen-embed"
            src="https://codepen.io/saulomg2s/embed/YPKbpKe?default-tab=html%2Cresult&theme-id=dark"></iframe>

        <div class="buttons-container">
            <a class="download-btn" href="#">Download</a>
            <a class="donation-btn" href="#">Donation</a>
        </div>
    </div>

    <!-- BUTTON -->
    <div class="code-column category-button active">
        <div class="code-title">
            <h2>🔘 Jump Button</h2>
        </div>

        <iframe class="codepen-embed"
            src="https://codepen.io/saulomg2s/embed/emOwKGJ?default-tab=html%2Cresult&theme-id=dark"></iframe>

        <div class="buttons-container">
            <a class="download-btn" href="#">Download</a>
            <a class="donation-btn" href="#">Donation</a>
        </div>
    </div>

    <!-- FOOTER -->
    <div class="code-column category-footer active">
        <div class="code-title">
            <h2>🔘 Flex CTA Footer</h2>
        </div>

        <iframe class="codepen-embed"
            src="https://codepen.io/saulomg2s/embed/gbYVYgz?default-tab=html%2Cresult&theme-id=dark"></iframe>

        <div class="buttons-container">
            <a class="download-btn" href="#">Download</a>
            <a class="donation-btn" href="#">Donation</a>
        </div>
    </div>

</div>

<!-- EFFECTS -->
<div class="code-gallery">

    <div class="code-column category-effect active">
        <div class="code-title">
            <h2>🔘 Scan Line Background</h2>
        </div>

        <iframe class="codepen-embed"
            src="https://codepen.io/saulomg2s/embed/yyBmegj?default-tab=html%2Cresult&theme-id=dark"></iframe>

        <div class="buttons-container">
            <a class="download-btn" href="#">Download</a>
            <a class="donation-btn" href="#">Donation</a>
        </div>
    </div>

</div>

<script src="script.js"></script>

</body>
</html>
